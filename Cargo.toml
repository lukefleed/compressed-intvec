[package]
name = "compressed-intvec"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["Luca Lombardo"]
description = "Space-efficient integer vectors with fixed-width, variable-length, and sequence-oriented encodings."
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/lukefleed/compressed-intvec"
keywords = ["compression", "vector", "integer", "data-structures", "succinct"]
categories = ["data-structures", "compression"]
exclude = [".github/*"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
dsi-bitstream = { version = "0.10.1", default-features = false, features = ["std"] }
mem_dbg = { version = "0.4.4", optional = true }
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }

# Only for model checking the synchronization of AtomicFixedVec, with RUSTFLAGS="--cfg loom".
[target.'cfg(loom)'.dependencies]
loom = "0.7.2"


[dev-dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde_json = "1.0.141"
# Compile-fail tests that compare the compiler's whole output, so each fails for its reason.
trybuild = "1.0.121"

[features]
parallel = ["dep:rayon"]
serde = ["dep:serde"]
# Implements the traits of mem_dbg 0.4. A minor release of this crate may move to a newer
# mem_dbg, so the traits that this feature implements are outside the semver guarantee.
mem_dbg = ["dep:mem_dbg"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[workspace]
members = ["bench"]

[profile.bench]
debug = "line-tables-only"

[profile.bench-lto]
inherits = "bench"
lto = "fat"
